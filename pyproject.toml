[project]
name = "btsmon"
version = "0.1.0"
description = "AI-agent monitoring and control of Neware BTS cyclers (reverse-engineered)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
btsmon = "btsmon.monitor:main"
btsmon-mcp = "btsmon.mcp_server:main"

[project.optional-dependencies]
test = ["pytest"]
mcp = ["mcp>=2.3"]

[tool.setuptools]
packages = ["btsmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
